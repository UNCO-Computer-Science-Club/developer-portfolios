<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Portfolio</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fff; color: #222; text-align: center; padding: 3rem 1rem; }
    a { color: #0969da; }
  </style>
</head>
<body>
  <p id="status">Picking a random portfolio&hellip;</p>
  <script>
    // Redirects to a random entry from this repo's feed.json (generated from README.md).
    // Served via GitHub Pages; falls back to the raw file if the relative fetch fails.
    const FEEDS = [
      "feed.json",
      "https://raw.githubusercontent.com/UNCO-Computer-Science-Club/developer-portfolios/master/feed.json"
    ];
    const LIST = "https://github.com/UNCO-Computer-Science-Club/developer-portfolios#readme";
    const status = document.getElementById("status");

    async function loadFeed() {
      for (const src of FEEDS) {
        try {
          const res = await fetch(src, { cache: "no-store" });
          if (res.ok) return await res.json();
        } catch (e) {}
      }
      return null;
    }

    loadFeed().then((portfolios) => {
      const valid = (portfolios || []).filter((p) => p && /^https?:\/\//.test(p.url));
      if (!valid.length) {
        status.innerHTML = 'Couldn\'t load the portfolio list. <a href="' + LIST + '">Browse it here</a>.';
        return;
      }
      const pick = valid[Math.floor(Math.random() * valid.length)];
      status.textContent = "Taking you to " + pick.name + "…";
      location.replace(pick.url);
    });
  </script>
</body>
</html>
